	let t = 0;
	let plist = Object.keys(planets);
	let d_scale = x => x * scaler; // in km
	let r_scale = x => x * scaler; // in km
	let keymap = {
		"0": "mercury",
		"1": "venus",
		"2": "earth",
		"m": "moon",
		"3": "mars",
		"4": "jupiter",
		"5": "saturn",
		"6": "uranus",
		"7": "neptune"
	}
	setInterval(function () {
		t += 2 * PI * 1 / 60;
		localStorage.setItem("scaler", scaler);
		localStorage.setItem("userTx", userTx);
		localStorage.setItem("userTy", userTy);
		localStorage.setItem("trackPlanet", trackPlanet);
		localStorage.setItem("trackedPlanet", trackedPlanet);
		ctx.resetTransform();
		ctx.clearRect(0, 0, cvs.width, cvs.height);
		if (trackPlanet) {
			if (trackedPlanet in planets) {
				planetTx = -planets[trackedPlanet].x * scaler;
				planetTy = -planets[trackedPlanet].y * scaler;
			}
		}
		if (showTrackMenu) {
			ctx.font = "20px sans";
			ctx.fillStyle = "#fff";
			ctx.textAlign = "center";
			ctx.fillText(`0:mercury   1:venus   2:earth   m:moon`, cvs.width / 2, 20)
			ctx.fillText(`3:mars  4:jupiter  5:saturn  6:uranus  7:neptune`, cvs.width / 2, 45);
			ctx.fill();
		}
		ctx.translate(cvs.width / 2, cvs.height / 2)
		ctx.scale(1, -1);
		ctx.translate(planetTx + userTx, planetTy + userTy)
		draw_body(ctx, sun);

		// update pos
		for (let p in planets) {
			let pl = planets[p];
			let r = pl.d/2;
			let px = pl.a * Math.cos(t * 1 / pl.op);
			let py = pl.a * Math.sqrt(1 - (pl?.e || 0) ** 2) * Math.sin(t * 1 / pl.op);
			let prx = Math.cos(pl.i / 180 * PI);
			let pry = Math.sin(pl.i / 180 * PI);
			pl.x = sun.x + px * prx  - py * pry;
			pl.y = sun.y + px * pry + py * prx;
			draw_body(ctx, pl, sun, PlanetScalar);
			let eA = Math.atan2(pl.y - sun.y, pl.x - sun.x);
			tri(ctx,
				pl.x + r * Math.cos(PI / 2 + eA), pl.y + r * Math.sin(PI / 2 + eA),
				sun.x + pl.a * 2 * Math.cos(eA), sun.y + pl.a * 2 * Math.sin(eA),
				pl.x + r * Math.cos(PI / 2 + eA + PI), pl.y + r * Math.sin(PI / 2 + eA + PI),
				pl.fill + "5"
			)
			planets[p] = pl;

			if ("moons" in pl) {
				let moon_cnt = 0;
				let total_moons_to_show = Math.ceil(Object.keys(pl.moons).length * .9);
				for (let m in pl.moons) {
					moon_cnt++;
					if (moon_cnt > total_moons_to_show) break;
					let moon = pl.moons[m];
					let mx = moon.a * Math.cos(t * 1 / moon.op);
					let my = moon.a * Math.sqrt(1 - (moon?.e || 0) ** 2) * Math.sin(t * 1 / moon.op);
					let mrx = Math.cos(moon.i / 180 * PI );
					let mry = Math.sin(moon.i / 180 * PI );
					moon.x = pl.x + mx * mrx  - my * mry;
					moon.y = pl.y + mx * mry + my * mrx;
					let dt = p == trackedPlanet && scaler > moonHighlightDepth;
					draw_body(ctx, moon, pl, MoonScalar, dt);
					if (dt && m == "moon") {
						let mA = Math.atan2(moon.y - sun.y, moon.x - sun.x);
						tri(ctx,
							moon.x + moon.d/2 * Math.cos(PI / 2 + mA), moon.y + moon.d/2 * Math.sin(PI / 2 + mA),
							sun.x + pl.a * 10 * Math.cos(mA), sun.y + pl.a * 10 * Math.sin(mA),
							moon.x + moon.d/2 * Math.cos(PI / 2 + mA + PI), moon.y + moon.d/2 * Math.sin(PI / 2 + mA + PI),
							"#8888"
						);
					}
					pl.moons[m] = moon;
				}
			}
		}
		for (let b in belt_obj) {
			let bo = belt_obj[b];
			bo.x = sun.x + bo.a * Math.cos(t * 1 / bo.op + bo.ph*2);
			bo.y = sun.y + bo.a * Math.sqrt(1 - (bo?.e || 0) ** 2) * Math.sin(t * 1 / bo.op+ bo.ph*2);
			draw_body(ctx, bo, sun, AstScalar);
			belt_obj[b] = bo;
		}
	}, 1000 / 40);

	cvs.addEventListener("wheel", (evt) => {
		scaler = Math.max(1 / pxtokm / 2, scaler - scaler * evt.deltaY / cvs.height * scrollAccel)
	});

	let oldUserTx = 0;
	let oldUserTy = 0;

	cvs.addEventListener("mousedown", (evt) => {
		dragstart = true;
		dragx = evt.x;
		dragy = evt.y;
		oldUserTx = userTx;
		oldUserTy = userTy;
	});
	
	cvs.addEventListener("mouseup", (evt) => {
		dragstart = false;
	});
	
	cvs.addEventListener("mouseleave", (evt) => {
		dragstart = false;
	});

	cvs.addEventListener("mousemove", (evt) => {
		if (dragstart) {
			userTx = oldUserTx + -(dragx - evt.x);
			userTy = oldUserTy + (dragy - evt.y);
		}
	});

	document.addEventListener("keydown", (evt) => {
		if (evt.key == "t") {
			trackPlanet = true;
			showTrackMenu = true;
		} else {
			if (evt.key == " ") {
				scaler = 1 / pxtokm;
				planetTx = 0;
				planetTy = 0;
				userTx = 0;
				userTy = 0;
				trackPlanet = false;
				trackedPlanet = "";
			} else if (trackPlanet) {
				if (evt.key in keymap) {
					trackedPlanet = keymap[evt.key];
					console.log("tracking " + trackedPlanet);
					userTx = 0;
					userTy = 0;
				} else if (showTrackMenu) {
					trackPlanet = false;
				}
				showTrackMenu = false;
			}
		}
	})



	/***
	 * @param {CanvasRenderingContext2D} ctx
	 *
	 **/
	function draw_body(ctx, obj, rel = "", extra_radius_scale=1, highlight=false) {
		let rx = obj.a;
		let ry = obj.a * Math.sqrt(1 - (obj?.e || 0) ** 2);
		let r = r_scale(obj.r ? obj.r : obj.d/2) * extra_radius_scale;
		// use inclination as basis

		if (rel != "") {
			ctx.beginPath();
			ctx.strokeStyle = "#fff";
			ctx.lineWidth = 0.2;
			ctx.ellipse(d_scale(rel.x), d_scale(rel.y), d_scale(rx), d_scale(ry), obj.i / 180 * PI, 0, PI * 2);
			ctx.stroke();
		}

		if (highlight) {
			ctx.beginPath();
			ctx.lineWidth = 2;
			ctx.moveTo(d_scale(obj.x) - 10, d_scale(obj.y))
			ctx.lineTo(d_scale(obj.x) + 10, d_scale(obj.y))
			ctx.moveTo(d_scale(obj.x), d_scale(obj.y) - 10)
			ctx.lineTo(d_scale(obj.x), d_scale(obj.y) + 10)
			ctx.stroke();
		}
		ctx.beginPath();
		ctx.fillStyle = obj.fill || "#f00";
		ctx.ellipse(d_scale(obj.x), d_scale(obj.y), r, r, 0, 0, PI * 2);
		ctx.fill();
		ctx.closePath();
	}

	function tri(ctx, x1, y1, x2, y2, x3, y3, fll) {
		ctx.beginPath();
		ctx.fillStyle = fll;
		ctx.moveTo(d_scale(x1), d_scale(y1));
		ctx.lineTo(d_scale(x2), d_scale(y2));
		ctx.lineTo(d_scale(x3), d_scale(y3));
		ctx.lineTo(d_scale(x1), d_scale(y1));
		ctx.fill();
		ctx.closePath();
	}
